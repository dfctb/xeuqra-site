<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xeuqra Records</title>
    <meta name="description" content="xeuqra — independent label for experimental electronic music">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" href="/assets/pictures/favicon-96.png" sizes="96x96">
    <link rel="apple-touch-icon" href="/assets/pictures/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
    <div class="topbar">
        <a href="/index.html" class="wordmark">
            <img src="/assets/pictures/logo.png" alt="xeuqra" class="logo">
            <span class="wordmark-text" id="typewriter" data-text="xeuqra.com" aria-hidden="true"></span>
        </a>
        <nav class="site-nav">
            <div class="nav-main">
                <a href="/index.html">home</a>

                <!-- Дропдаун со всеми подразделениями -->
                <div class="dropdown">
                    <a href="/pages/records.html">xeuqra ▾</a>
                    <div class="dropdown-content">
                        <a href="/pages/records.html">records</a>
                        <a href="/pages/design.html">design</a>
                        <a href="/pages/audio.html">audio</a>
                        <a href="/pages/sandbox.html">sandbox</a>
                    </div>
                </div>

                <a href="/index.html#contact">contact</a>
            </div>
            <div class="nav-pages">
                <a href="/pages/artists.html">artists</a>
                <a href="/pages/releases.html">releases</a>
                <a href="/pages/news.html">news</a>
                <a href="/pages/others.html">others</a>
            </div>
        </nav>
    </div>
</header>

<main>

    <section id="home">
        <div class="announcement-carousel" id="announcement-carousel">
            <button class="announcement-arrow announcement-arrow--prev" id="announcement-prev" aria-label="previous">‹
            </button>
            <div class="announcement-track" id="announcement-track"></div>
            <button class="announcement-arrow announcement-arrow--next" id="announcement-next" aria-label="next">›
            </button>
        </div>
    </section>

    <section id="label">
        <h1>label</h1>

        <!-- 1. Добавляем контейнер сетки -->
        <div class="label-layout">

            <!-- 2. Оборачиваем весь текст в левую колонку -->
            <div class="label-text">
                <div class="prose">
                    <p id="label-description"></p>
                </div>
                <br>
                <dl class="kv" id="label-kv"></dl>
            </div>

            <!-- 3. Правая колонка (логотип) -->
            <div class="label-logo">
                <img src="/assets/pictures/logo.png" alt="Label Logo">
            </div>

        </div>
    </section>

    <section id="contact">
        <h1>contact <b>— links</b></h1>
        <ul class="links" id="contact-links"></ul>
    </section>

</main>

<div class="bottom-banner">
    <img src="/assets/announcements/pictures/render_3.jpg" alt="Xeuqra Render">
</div>

<footer>
    <img src="/favicon.ico" alt="Icon" class="footer-icon">
    <span>© Xeuqra, <span id="year"></span>. all rights reserved. Website designed by Xeuqra Design. </span>
</footer>

<script src="/js/typewriter.js"></script>
<script src="/js/footer-year.js"></script>
<script src="/js/main-loader.js"></script>
<script src="/js/scrollspy.js" defer></script>
<script src="/js/announcements.js"></script>
</body>
</html>
