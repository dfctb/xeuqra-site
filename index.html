<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xeuqra Records</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="topbar">
    <a href="#" class="wordmark">
      <img src="assets/pictures/logo.png" alt="Xeuqra Records" class="logo">
    </a>
    <nav>
      <a href="html/news.html">news</a>
      <a href="#releases" class="active">releases</a>
      <a href="#artists">artists</a>
      <a href="#label">label</a>
      <a href="#contact">contact</a>
    </nav>
  </div>
</header>

<main>

<!-- СЕКЦИЯ RELEASES -->
<section id="releases">
  <h1>releases <b>— catalog</b></h1>
  <table>
    <thead>
      <tr>
        <th style="width: 15%">cat</th>
        <th style="width: 25%">artist</th>
        <th style="width: 45%">title</th>
        <th style="width: 15%">year</th>
      </tr>
    </thead>
    <tbody id="releases-table-body">
      <!-- Сюда JS загрузит релизы из JSON -->
    </tbody>
  </table>
</section>

<!-- СЕКЦИЯ ARTISTS -->
<section id="artists">
  <h1>artists <b>— roster</b></h1>
  <div class="artists" id="artists-container">
    <!-- Сюда JS загрузит артистов из JSON -->
  </div>
</section>

<!-- СЕКЦИЯ LABEL & CONTACTS -->
<section id="label">
  <h1>label</h1>
  <div class="prose">
    <p id="label-description"><!-- Текст о лейбле --></p>
  </div>
  <br>
  <dl class="kv" id="label-kv">
    <!-- Технические данные лейбла -->
  </dl>
</section>

<section id="contact">
  <h1>contact <b>— links</b></h1>
  <ul class="links" id="contact-links">
    <!-- Ссылки на соцсети -->
  </ul>
</section>

</main>

<footer>
  © Xeuqra Records, <span id="year"></span>. all rights reserved.
</footer>

<script src="js/footer-year.js"></script>
<script src="js/scrollspy.js" defer></script>
<script src="js/main-loader.js" defer></script>
</body>
</html>
