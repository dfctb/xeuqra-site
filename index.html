<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xeuqra Records</title>
    <meta name="description" content="xeuqra — independent label for experimental electronic music">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" href="/favicon.ico?v=aa1cfdf87332" sizes="48x48">
    <link rel="icon" type="image/png" href="/assets/pictures/favicon-96.png?v=6e766f3cab1e" sizes="96x96">
    <link rel="apple-touch-icon" href="/assets/pictures/apple-touch-icon.png?v=8da1dad3344a">
    <link rel="stylesheet" href="/css/style.css?v=f6ca594c363a">
</head>
<body>

<header>
    <div class="topbar">
        <a href="/" class="wordmark">
            <img src="/assets/pictures/logo-header.png?v=54b2ebd809ad" alt="xeuqra" class="logo" width="28" height="28">
            <span class="wordmark-text" id="typewriter" data-text="xeuqra.com" aria-hidden="true"></span>
        </a>
        <nav class="site-nav">
            <div class="nav-main">
                <a href="/">home</a>

                <!-- Дропдаун со всеми подразделениями -->
                <div class="dropdown">
                    <a href="/pages/records">xeuqra ▾</a>
                    <div class="dropdown-content">
                        <a href="/pages/records">records</a>
                        <a href="/pages/design">design</a>
                        <a href="/pages/audio">audio</a>
                        <a href="/pages/sandbox">sandbox</a>
                    </div>
                </div>

                <a href="/#contact">contact</a>
            </div>
            <div class="nav-pages">
                <a href="/pages/artists">artists</a>
                <a href="/pages/releases">releases</a>
                <a href="/pages/news">news</a>
                <a href="/pages/others">others</a>
            </div>
        </nav>
    </div>
</header>

<main>

    <section id="home">
        <div class="announcement-carousel" id="announcement-carousel">
            <button class="announcement-arrow announcement-arrow--prev" id="announcement-prev" aria-label="previous">‹
            </button>
            <div class="announcement-track" id="announcement-track">
                <picture aria-hidden="true">
                    <source type="image/webp" sizes="100vw" srcset="/assets/announcements/pictures/news-640.webp?v=0c5d6fc4f3be 640w, /assets/announcements/pictures/news-1280.webp?v=bc2ac83ab764 1280w, /assets/announcements/pictures/news-1920.webp?v=cc70da47ad84 1920w">
                    <img class="announcement-image" src="/assets/announcements/pictures/news.jpg?v=605a422d0518" width="1920" height="1080" alt="" fetchpriority="high" decoding="async">
                </picture>
                <div class="announcement-overlay"></div>
            </div>
            <button class="announcement-arrow announcement-arrow--next" id="announcement-next" aria-label="next">›
            </button>
        </div>
    </section>

    <section id="label">
        <h1>label</h1>

        <!-- 1. Добавляем контейнер сетки -->
        <div class="label-layout">

            <!-- 2. Оборачиваем весь текст в левую колонку -->
            <div class="label-text">
                <div class="prose">
                    <p id="label-description"></p>
                </div>
                <br>
                <dl class="kv" id="label-kv"></dl>
            </div>

            <!-- 3. Правая колонка (логотип) -->
            <div class="label-logo">
                <img src="/assets/pictures/xeuqra-main.jpg?v=563e37bff147" alt="Label Logo" width="840" height="840" decoding="async" loading="lazy">
            </div>

        </div>
    </section>

    <section id="contact">
        <h1>contact <b>— links</b></h1>
        <ul class="links" id="contact-links"></ul>
    </section>

</main>

<div class="bottom-banner">
    <img src="/assets/announcements/pictures/render_3.jpg?v=80f5cec33ad2" alt="Xeuqra Render" width="1280" height="720" decoding="async" loading="lazy">
</div>

<footer>
    <img src="/favicon.ico?v=aa1cfdf87332" alt="Icon" class="footer-icon" width="48" height="48" decoding="async" loading="lazy">
    <span>© Xeuqra, <span id="year"></span>. all rights reserved. Website designed by Xeuqra Design. </span>
</footer>

<script src="/js/site.js?v=db5613b536ea" defer></script>
<script src="/js/typewriter.js?v=8897f3237cdd" defer></script>
<script src="/js/footer-year.js?v=6aad45268cdb" defer></script>
<script src="/js/main-loader.js?v=1f32344d64cb" defer></script>
<script src="/js/scrollspy.js?v=72a20be77d2b" defer></script>
<script src="/js/announcements.js?v=481b012bde13" defer></script>
</body>
</html>
