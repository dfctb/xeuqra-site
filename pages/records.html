<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xeuqra Design</title> <!-- Меняем название -->
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" href="/favicon.ico?v=aa1cfdf87332" sizes="48x48">
    <link rel="stylesheet" href="/css/style.css?v=f6ca594c363a">
</head>
<body>

<!-- Шапка (копируем из index.html) -->
<header>
    <div class="topbar">
        <a href="/" class="wordmark">
            <img src="/assets/pictures/logo-header.png?v=54b2ebd809ad" alt="xeuqra" class="logo" width="28" height="28">
            <span class="wordmark-text" id="typewriter" data-text="xeuqra.com" aria-hidden="true"></span>
        </a>
        <nav class="site-nav">
            <div class="nav-main">
                <a href="/">home</a>

                <!-- Дропдаун со всеми подразделениями -->
                <div class="dropdown">
                    <a href="/pages/records">xeuqra ▾</a>
                    <div class="dropdown-content">
                        <a href="/pages/records">records</a>
                        <a href="/pages/design">design</a>
                        <a href="/pages/audio">audio</a>
                        <a href="/pages/sandbox">sandbox</a>
                    </div>
                </div>

                <a href="/#contact">contact</a>
            </div>
            <div class="nav-pages">
                <a href="/pages/artists">artists</a>
                <a href="/pages/releases">releases</a>
                <a href="/pages/news">news</a>
                <a href="/pages/others">others</a>
            </div>
        </nav>
    </div>
</header>

<main>
    <!-- Универсальная секция для подстраниц -->
    <section id="subpage">
        <!-- Заголовок будет меняться через JS (records, design, etc) -->
        <h1 id="page-title">loading...</h1>

        <!-- Используем ту же сетку, что и на главной -->
        <div class="label-layout">

            <!-- Левая колонка (текст) -->
            <div class="label-text">
                <div class="prose">
                    <p id="page-desc"></p>
                </div>

                <!-- Список (услуги, продукты) -->
                <ul class="links" id="page-list" style="margin-top: 20px;"></ul>

                <!-- Характеристики (KV) -->
                <dl class="kv" id="page-kv" style="margin-top: 20px;"></dl>
            </div>

            <!-- Правая колонка (логотип) -->
            <div class="label-logo">
                <img src="/assets/pictures/logo.png?v=9e2d92998829" alt="Logo" width="840" height="840" decoding="async">
            </div>

        </div>
    </section>
</main>

<!-- Футер (копируем из index.html) -->
<footer>
    <img src="/favicon.ico?v=aa1cfdf87332" alt="Icon" class="footer-icon" width="48" height="48" decoding="async">
    <span>© Xeuqra, <span id="year"></span>. all rights reserved. Website designed by Xeuqra Design.</span>
</footer>

<!-- Скрипты -->
<script src="/js/site.js?v=db5613b536ea" defer></script>
<script src="/js/typewriter.js?v=8897f3237cdd" defer></script>
<script src="/js/footer-year.js?v=6aad45268cdb" defer></script>
<script src="/js/subpage.js?v=03d5135e49e9" defer></script> <!-- Подключаем новый скрипт -->
</body>
</html>
