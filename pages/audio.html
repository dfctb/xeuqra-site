<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xeuqra Design</title> <!-- Меняем название -->
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Шапка (копируем из index.html) -->
<header>
    <div class="topbar">
        <a href="/index.html" class="wordmark">
            <img src="/assets/pictures/logo.png" alt="xeuqra" class="logo">
            <span class="wordmark-text" id="typewriter" data-text="xeuqra.com" aria-hidden="true"></span>
        </a>
        <nav class="site-nav">
            <div class="nav-main">
                <a href="/index.html">home</a>

                <!-- Дропдаун со всеми подразделениями -->
                <div class="dropdown">
                    <a href="/pages/records.html">xeuqra ▾</a>
                    <div class="dropdown-content">
                        <a href="/pages/records.html">records</a>
                        <a href="/pages/design.html">design</a>
                        <a href="/pages/audio.html">audio</a>
                        <a href="/pages/sandbox.html">sandbox</a>
                    </div>
                </div>

                <a href="/index.html#contact">contact</a>
            </div>
            <div class="nav-pages">
                <a href="/pages/artists.html">artists</a>
                <a href="/pages/releases.html">releases</a>
                <a href="/pages/news.html">news</a>
                <a href="/pages/others.html">others</a>
            </div>
        </nav>
    </div>
</header>

<main>
    <!-- Универсальная секция для подстраниц -->
    <section id="subpage">
        <!-- Заголовок будет меняться через JS (records, design, etc) -->
        <h1 id="page-title">loading...</h1>

        <!-- Используем ту же сетку, что и на главной -->
        <div class="label-layout">

            <!-- Левая колонка (текст) -->
            <div class="label-text">
                <div class="prose">
                    <p id="page-desc"></p>
                </div>

                <!-- Список (услуги, продукты) -->
                <ul class="links" id="page-list" style="margin-top: 20px;"></ul>

                <!-- Характеристики (KV) -->
                <dl class="kv" id="page-kv" style="margin-top: 20px;"></dl>
            </div>

            <!-- Правая колонка (логотип) -->
            <div class="label-logo">
                <img src="/assets/pictures/logo-audio.jpg" alt="Logo">
            </div>

        </div>
    </section>
</main>

<!-- Футер (копируем из index.html) -->
<footer>
    <img src="/favicon.ico" alt="Icon" class="footer-icon">
    <span>© Xeuqra, <span id="year"></span>. all rights reserved. Website designed by Xeuqra Design.</span>
</footer>

<!-- Скрипты -->
<script src="/js/typewriter.js"></script>
<script src="/js/footer-year.js"></script>
<script src="/js/subpage.js"></script> <!-- Подключаем новый скрипт -->
</body>
</html>
